<rect width="1600" height="1000" fill="url(#bg)"/><g opacity=".18" stroke="#39ffbd" stroke-width="2"><path d="M110 250 C420 80 740 310 1050 150 S1330 145 1510 300" fill="none"/><path d="M120 800 C420 610 730 850 980 690 S1290 610 1510 760" fill="none"/></g><g fill="#39ffbd" filter="url(#glow)"><circle cx="175" cy="225" r="7"/><circle cx="550" cy="180" r="7"/><circle cx="1000" cy="170" r="7"/><circle cx="1390" cy="220" r="7"/><circle cx="420" cy="690" r="7"/><circle cx="990" cy="690" r="7"/><circle cx="1320" cy="640" r="7"/></g>
<text x="80" y="100" class="title">네이버 AI 기술력 분석</text><text x="84" y="145" class="sub">한국어·문화 이해, 서비스 데이터, 클라우드, 소버린 AI를 결합한 수직형 AI 전략</text>
<rect x="80" y="190" width="455" height="220" class="card"/><text x="115" y="245" class="h">핵심 모델</text><text x="115" y="315" class="m">HyperCLOVA X</text><text x="115" y="360" class="t">한국어·문화 특화 LLM</text><text x="115" y="392" class="small">THINK / SEED / DASH 라인업</text>
<rect x="575" y="190" width="455" height="220" class="card"/><text x="610" y="245" class="h">언어 경쟁력</text><text x="610" y="315" class="m">Korean-first</text><text x="610" y="360" class="t">한국어 데이터·토크나이저 최적화</text><text x="610" y="392" class="small">문화/상식/문체 이해 강점</text>
<rect x="1070" y="190" width="455" height="220" class="card"/><text x="1105" y="245" class="h">전략 포지션</text><text x="1105" y="315" class="m">Sovereign AI</text><text x="1105" y="360" class="t">국가·기업 맞춤형 AI 인프라</text><text x="1105" y="392" class="small">클라우드·보안·현지화 결합</text>
<rect x="80" y="460" width="340" height="270" class="card"/><text x="115" y="520" class="h">강점</text><text x="115" y="575" class="t">• 검색/쇼핑/콘텐츠 데이터</text><text x="115" y="610" class="t">• 한국어 서비스 접점</text><text x="115" y="645" class="t">• 네이버클라우드</text><text x="115" y="680" class="t">• B2B 적용 경험</text>
<rect x="455" y="460" width="340" height="270" class="card"/><text x="490" y="520" class="h">기술 축</text><text x="490" y="575" class="t">• LLM / 추론 모델</text><text x="490" y="610" class="t">• 멀티모달</text><text x="490" y="645" class="t">• 경량·오픈 모델</text><text x="490" y="680" class="t">• AI Safety</text>
<rect x="830" y="460" width="340" height="270" class="card"/><text x="865" y="520" class="h">약점</text><text x="865" y="575" class="t">• 글로벌 범용 모델 격차</text><text x="865" y="610" class="t">• GPU/자본 규모 열세</text><text x="865" y="645" class="t">• 킬러앱 증명 필요</text><text x="865" y="680" class="t">• 해외 확장 난이도</text>
<rect x="1205" y="460" width="320" height="270" class="card"/><text x="1240" y="520" class="h">판정</text><text x="1240" y="575" class="t">세계 1위 LLM 경쟁보다</text><text x="1240" y="610" class="t">한국어·산업·소버린 AI</text><text x="1240" y="645" class="t">특화 시장에서 강함</text><text x="1240" y="690" class="m" style="font-size:31px">지역 특화 강자</text>
<rect x="80" y="785" width="1445" height="110" rx="30" fill="#050c18" stroke="#39ffbd" stroke-opacity=".35"/><text x="120" y="850" style="font:800 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">핵심: 네이버 AI의 승부처는 GPT 정면승부가 아니라, 한국어·서비스 데이터·클라우드가 결합된 현지화 AI 플랫폼.</text><text x="990" y="950" class="brand">Jeremy's Insight by 🤖 딸깍봇 / blog.naver.com/jeremylee0213</text></svg>