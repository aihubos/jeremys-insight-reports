<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17120a"/><stop offset="0.55" stop-color="#31240d"/><stop offset="1" stop-color="#071827"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter><filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ffd166" flood-opacity=".5"/></filter><style>.title{font:900 62px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.sub{font:500 27px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#ffe7a3}.card{fill:#151d28;stroke:#755c22;stroke-width:2;rx:30;filter:url(#shadow)}.h{font:800 31px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.t{font:500 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f3ead1}.m{font:900 46px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#ffd166}.good{fill:#67e8a4}.bad{fill:#ff7b7b}.small{font:600 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cdbf9a}.brand{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#ffe7a3}</style></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><g opacity=".16" stroke="#ffd166" stroke-width="2"><path d="M110 720 C360 520 610 620 760 430 S1050 230 1470 270" fill="none"/><path d="M140 780 L330 670 L520 700 L710 560 L900 590 L1110 390 L1360 430 L1490 330" fill="none"/></g><g fill="#ffd166" filter="url(#glow)"><circle cx="330" cy="670" r="8"/><circle cx="710" cy="560" r="8"/><circle cx="1110" cy="390" r="8"/><circle cx="1490" cy="330" r="8"/></g>
<text x="80" y="100" class="title">금 투자 5년 전망</text><text x="84" y="145" class="sub">추천 여부: 몰빵은 비추천, 포트폴리오 보험 자산으로는 조건부 추천</text>
<rect x="80" y="190" width="455" height="220" class="card"/><text x="115" y="245" class="h">5년 기본 시나리오</text><text x="115" y="315" class="m">우상향·고변동</text><text x="115" y="360" class="t">실질금리·달러·지정학이 좌우</text><text x="115" y="392" class="small">단기 조정 가능성은 높음</text>
<rect x="575" y="190" width="455" height="220" class="card"/><text x="610" y="245" class="h">추천 비중</text><text x="610" y="315" class="m">5~15%</text><text x="610" y="360" class="t">포트폴리오 방어용 한정</text><text x="610" y="392" class="small">공격적 수익자산 아님</text>
<rect x="1070" y="190" width="455" height="220" class="card"/><text x="1105" y="245" class="h">판정</text><text x="1105" y="315" class="m">조건부 추천</text><text x="1105" y="360" class="t">분할매수·리밸런싱 전제</text><text x="1105" y="392" class="small">고점 추격 매수는 비추천</text>
<rect x="80" y="460" width="340" height="270" class="card"/><text x="115" y="520" class="h good">상승 요인</text><text x="115" y="575" class="t">• 중앙은행 매입</text><text x="115" y="610" class="t">• 지정학 리스크</text><text x="115" y="645" class="t">• 달러 약세 가능성</text><text x="115" y="680" class="t">• ETF 자금 유입</text>
<rect x="455" y="460" width="340" height="270" class="card"/><text x="490" y="520" class="h bad">하락 요인</text><text x="490" y="575" class="t">• 실질금리 상승</text><text x="490" y="610" class="t">• 달러 강세</text><text x="490" y="645" class="t">• 리스크온 장세</text><text x="490" y="680" class="t">• 보석 수요 둔화</text>
<rect x="830" y="460" width="340" height="270" class="card"/><text x="865" y="520" class="h">전략</text><text x="865" y="575" class="t">• 일시매수보다 분할</text><text x="865" y="610" class="t">• 원화 환율 고려</text><text x="865" y="645" class="t">• ETF/현물 목적 분리</text><text x="865" y="680" class="t">• 연 1~2회 리밸런싱</text>
<rect x="1205" y="460" width="320" height="270" class="card"/><text x="1240" y="520" class="h">주의</text><text x="1240" y="575" class="t">금은 배당·이자 없음</text><text x="1240" y="610" class="t">장기 기대수익은</text><text x="1240" y="645" class="t">주식보다 낮을 수 있음</text><text x="1240" y="690" class="bad" style="font:800 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">몰빵 금지</text>
<rect x="80" y="785" width="1445" height="110" rx="30" fill="#070b12" stroke="#ffd166" stroke-opacity=".4"/><text x="120" y="850" style="font:800 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">결론: 금은 ‘부자 되는 주력 엔진’보다, 위기와 인플레·달러 리스크를 줄이는 보험성 자산으로 접근.</text><text x="990" y="950" class="brand">Jeremy's Insight by 🤖 딸깍봇 / blog.naver.com/jeremylee0213</text></svg>