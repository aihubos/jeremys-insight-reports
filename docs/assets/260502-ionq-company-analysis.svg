<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#11163a"/><stop offset="1" stop-color="#261047"/></linearGradient><filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#6ee7ff" flood-opacity="0.45"/></filter><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.32"/></filter><style>.title{font:900 66px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.sub{font:500 27px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b7c7ff}.card{fill:#101b32;stroke:#29456d;stroke-width:2;rx:30;filter:url(#shadow)}.h{font:800 31px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.t{font:500 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d7e1ff}.m{font:900 50px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6ee7ff}.warn{fill:#ffcc66}.brand{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b7c7ff}.small{font:600 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9fb0d8}</style></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><g opacity=".22" stroke="#6ee7ff" stroke-width="2"><path d="M220 250 C440 120, 760 250, 960 130 S1320 120, 1460 260" fill="none"/><path d="M160 760 C410 600, 710 790, 920 650 S1250 590, 1480 750" fill="none"/></g><g fill="#6ee7ff" filter="url(#glow)" opacity=".9"><circle cx="220" cy="250" r="8"/><circle cx="760" cy="210" r="8"/><circle cx="960" cy="130" r="8"/><circle cx="1460" cy="260" r="8"/><circle cx="410" cy="650" r="8"/><circle cx="920" cy="650" r="8"/><circle cx="1250" cy="620" r="8"/></g>
<text x="82" y="100" class="title">IonQ 기업분석</text><text x="88" y="145" class="sub">양자컴퓨팅 하드웨어 기업에서 풀스택 양자 플랫폼 기업으로 확장 중</text>
<rect x="80" y="190" width="455" height="220" class="card"/><text x="115" y="245" class="h">2025 매출</text><text x="115" y="315" class="m">$130.0M</text><text x="115" y="360" class="t">전년 대비 +202%</text><text x="115" y="390" class="small">첫 $100M+ GAAP 매출 양자 기업</text>
<rect x="575" y="190" width="455" height="220" class="card"/><text x="610" y="245" class="h">현금/투자</text><text x="610" y="315" class="m">$3.3B</text><text x="610" y="360" class="t">상용화 장기전 버틸 체력</text><text x="610" y="390" class="small">M&A·R&D·제조 내재화 자금</text>
<rect x="1070" y="190" width="455" height="220" class="card"/><text x="1105" y="245" class="h">2026 가이던스</text><text x="1105" y="315" class="m">$225~245M</text><text x="1105" y="360" class="t">고성장 지속, 적자도 지속</text><text x="1105" y="390" class="small">Adj. EBITDA -$330~-310M 전망</text>
<rect x="80" y="460" width="340" height="270" class="card"/><text x="115" y="520" class="h">사업 축</text><text x="115" y="575" class="t">• 양자컴퓨팅</text><text x="115" y="610" class="t">• 양자네트워킹</text><text x="115" y="645" class="t">• 양자보안</text><text x="115" y="680" class="t">• 양자센싱</text>
<rect x="455" y="460" width="340" height="270" class="card"/><text x="490" y="520" class="h">강점</text><text x="490" y="575" class="t">• Trapped-ion 기술</text><text x="490" y="610" class="t">• 클라우드 접근성</text><text x="490" y="645" class="t">• 정부/연구기관 계약</text><text x="490" y="680" class="t">• 풀스택 확장</text>
<rect x="830" y="460" width="340" height="270" class="card"/><text x="865" y="520" class="h">리스크</text><text x="865" y="575" class="t">• 높은 밸류에이션</text><text x="865" y="610" class="t">• 영업적자 지속</text><text x="865" y="645" class="t">• 상용화 시간 불확실</text><text x="865" y="680" class="t">• 경쟁 심화</text>
<rect x="1205" y="460" width="320" height="270" class="card"/><text x="1240" y="520" class="h">판단</text><text x="1240" y="575" class="t">기술 옵션 가치 큼</text><text x="1240" y="610" class="t">단, 실적 대비 주가</text><text x="1240" y="645" class="t">민감도 매우 높음</text><text x="1240" y="690" class="warn" style="font:800 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">장기 고위험 성장주</text>
<rect x="80" y="785" width="1445" height="110" rx="30" fill="#050914" stroke="#6ee7ff" stroke-opacity=".35"/><text x="120" y="850" style="font:800 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">핵심: IonQ는 ‘양자컴퓨터 판매 기업’이 아니라, 양자 인프라 플랫폼 선점을 노리는 고위험·고잠재 성장주.</text><text x="990" y="950" class="brand">Jeremy's Insight by 🤖 딸깍봇 / blog.naver.com/jeremylee0213</text></svg>