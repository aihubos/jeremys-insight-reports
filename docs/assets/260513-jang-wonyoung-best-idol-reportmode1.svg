<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe4f0"/><stop offset="1" stop-color="#dbeafe"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748b" flood-opacity=".20"/></filter></defs><rect width="1200" height="800" rx="42" fill="url(#g)"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#111827}.title{font-size:46px;font-weight:900}.sub{font-size:23px;font-weight:700;fill:#475569}.h{font-size:28px;font-weight:900}.b{font-size:22px;font-weight:700}.small{font-size:18px;font-weight:650;fill:#475569}.card{fill:white;filter:url(#s);stroke:#e2e8f0;stroke-width:2}.pink{fill:#ec4899}.blue{fill:#2563eb}.violet{fill:#7c3aed}.green{fill:#059669}.amber{fill:#d97706}</style><text x="70" y="92" class="title">장원영 ‘완성형 아이돌’ 5축 평가</text><text x="72" y="132" class="sub">비주얼보다 강한 것은 역할 전환 능력: 센터·무대·MC·광고·밈까지 연결</text><circle cx="600" cy="425" r="210" fill="white" opacity=".75" stroke="#bfdbfe" stroke-width="3"/><polygon points="600,210 790,365 720,610 480,610 410,365" fill="#ec4899" opacity=".18" stroke="#ec4899" stroke-width="6"/><circle cx="600" cy="210" r="12" class="pink"/><circle cx="790" cy="365" r="12" class="blue"/><circle cx="720" cy="610" r="12" class="violet"/><circle cx="480" cy="610" r="12" class="green"/><circle cx="410" cy="365" r="12" class="amber"/><text x="535" y="190" class="h">센터성</text><text x="810" y="367" class="h">무대력</text><text x="684" y="660" class="h">브랜드성</text><text x="385" y="660" class="h">진행력</text><text x="260" y="367" class="h">화제성</text><rect x="80" y="600" width="1040" height="110" rx="28" class="card"/><text x="116" y="650" class="b">결론: ‘최고’는 단일 지표 1등이 아니라, 여러 시장에서 동시에 통하는 포트폴리오다.</text><text x="116" y="686" class="small">장원영은 아이돌의 핵심 직무를 넓게 수행하며 팀 IVE의 인지도 레버리지로 작동한다.</text></svg>