<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe4f0"/><stop offset="1" stop-color="#dbeafe"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748b" flood-opacity=".20"/></filter></defs><rect width="1200" height="800" rx="42" fill="url(#g)"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#111827}.title{font-size:46px;font-weight:900}.sub{font-size:23px;font-weight:700;fill:#475569}.h{font-size:28px;font-weight:900}.b{font-size:22px;font-weight:700}.small{font-size:18px;font-weight:650;fill:#475569}.card{fill:white;filter:url(#s);stroke:#e2e8f0;stroke-width:2}.pink{fill:#ec4899}.blue{fill:#2563eb}.violet{fill:#7c3aed}.green{fill:#059669}.amber{fill:#d97706}</style><text x="70" y="92" class="title">‘최고 아이돌’ 판단 프레임</text><text x="72" y="132" class="sub">팬심을 넘어 보고서형으로 보면, 장원영의 강점은 지속 가능성이다</text><rect x="90" y="205" width="315" height="395" rx="32" class="card"/><rect x="442" y="205" width="315" height="395" rx="32" class="card"/><rect x="795" y="205" width="315" height="395" rx="32" class="card"/><text x="130" y="270" class="h pink">① 즉시성</text><text x="130" y="325" class="b">한 컷만으로도 인지</text><text x="130" y="365" class="small">센터 비주얼, 표정, 포즈가</text><text x="130" y="397" class="small">콘텐츠 썸네일 경쟁에 강함</text><text x="482" y="270" class="h blue">② 확장성</text><text x="482" y="325" class="b">무대 밖 역할까지 수행</text><text x="482" y="365" class="small">MC·광고·패션·SNS에서</text><text x="482" y="397" class="small">아이돌 IP 범위를 확대</text><text x="835" y="270" class="h violet">③ 관리력</text><text x="835" y="325" class="b">어린 데뷔 이후 장기 노출</text><text x="835" y="365" class="small">높은 관심 속에서도 이미지를</text><text x="835" y="397" class="small">일관되게 유지하는 역량</text><rect x="165" y="670" width="870" height="72" rx="26" fill="#111827" opacity=".92"/><text x="215" y="716" fill="white" style="font-size:27px;font-weight:900;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Arial">최종 평가: 장원영은 ‘아이돌 직무의 표준값’을 높인 대표 사례</text></svg>