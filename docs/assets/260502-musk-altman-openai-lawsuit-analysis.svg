<text x="80" y="96" class="title">알트만 vs 머스크 법정다툼</text><text x="84" y="142" class="sub">OpenAI의 ‘비영리 미션’과 ‘상업화·AI 패권’이 충돌한 사건</text>
<rect x="80" y="190" width="455" height="220" class="card"/><text x="115" y="245" class="h">표면적 쟁점</text><text x="115" y="315" class="m">약속 위반?</text><text x="115" y="360" class="t">비영리·오픈AI 미션에서</text><text x="115" y="392" class="small">영리 구조로 변했는지가 핵심</text>
<rect x="575" y="190" width="455" height="220" class="card"/><text x="610" y="245" class="h">실질적 쟁점</text><text x="610" y="315" class="m">지배권 경쟁</text><text x="610" y="360" class="t">AI 플랫폼 권력·자본·평판</text><text x="610" y="392" class="small">OpenAI vs xAI 경쟁 구도</text>
<rect x="1070" y="190" width="455" height="220" class="card"/><text x="1105" y="245" class="h">산업적 의미</text><text x="1105" y="315" class="m">AI 거버넌스</text><text x="1105" y="360" class="t">공익 연구소가 빅테크형</text><text x="1105" y="392" class="small">상업 기업으로 바뀔 수 있는가</text>
<rect x="80" y="460" width="340" height="270" class="card"/><text x="115" y="520" class="h red">머스크 주장</text><text x="115" y="575" class="t">• 창립 미션 배신</text><text x="115" y="610" class="t">• 비영리 약속 위반</text><text x="115" y="645" class="t">• MS와 상업화</text><text x="115" y="680" class="t">• 공익보다 수익 우선</text>
<rect x="455" y="460" width="340" height="270" class="card"/><text x="490" y="520" class="h blue">OpenAI 입장</text><text x="490" y="575" class="t">• 근거 없는 소송</text><text x="490" y="610" class="t">• 머스크도 영리화 논의</text><text x="490" y="645" class="t">• 경쟁사 xAI 방어</text><text x="490" y="680" class="t">• 질투·후회성 공격</text>
