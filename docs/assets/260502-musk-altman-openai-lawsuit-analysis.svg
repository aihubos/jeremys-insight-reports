<rect x="1205" y="460" width="320" height="270" class="card"/><text x="1240" y="520" class="h">판정</text><text x="1240" y="575" class="t">법적 다툼이지만</text><text x="1240" y="610" class="t">본질은 AI 시대</text><text x="1240" y="645" class="t">권력 배분 문제</text><text x="1240" y="690" class="m" style="font-size:31px">미션 vs 시장</text>
<rect x="80" y="785" width="1445" height="110" rx="30" fill="#050914" stroke="#ffcc66" stroke-opacity=".35"/><text x="120" y="850" style="font:800 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">핵심: 이 소송은 개인 감정싸움이 아니라, AGI를 누가 통제하고 수익화할 것인가에 대한 권력 분쟁.</text><text x="990" y="950" class="brand">Jeremy's Insight by 🤖 딸깍봇 / blog.naver.com/jeremylee0213</text></svg>