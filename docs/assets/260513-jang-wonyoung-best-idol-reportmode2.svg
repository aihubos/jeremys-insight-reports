<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe4f0"/><stop offset="1" stop-color="#dbeafe"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748b" flood-opacity=".20"/></filter></defs><rect width="1200" height="800" rx="42" fill="url(#g)"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#111827}.title{font-size:46px;font-weight:900}.sub{font-size:23px;font-weight:700;fill:#475569}.h{font-size:28px;font-weight:900}.b{font-size:22px;font-weight:700}.small{font-size:18px;font-weight:650;fill:#475569}.card{fill:white;filter:url(#s);stroke:#e2e8f0;stroke-width:2}.pink{fill:#ec4899}.blue{fill:#2563eb}.violet{fill:#7c3aed}.green{fill:#059669}.amber{fill:#d97706}</style><text x="70" y="92" class="title">장원영 브랜드 플라이휠</text><text x="72" y="132" class="sub">공개 활동이 팬덤·광고·SNS 화제성을 되먹임하는 구조</text><g transform="translate(145 205)"><rect width="250" height="145" rx="28" class="card"/><text x="42" y="62" class="h">무대/콘텐츠</text><text x="42" y="99" class="small">IVE 활동·직캠·숏폼</text></g><g transform="translate(475 140)"><rect width="250" height="145" rx="28" class="card"/><text x="55" y="62" class="h">팬덤 확산</text><text x="42" y="99" class="small">입덕 포인트 축적</text></g><g transform="translate(805 205)"><rect width="250" height="145" rx="28" class="card"/><text x="58" y="62" class="h">광고/패션</text><text x="42" y="99" class="small">브랜드 신뢰 전환</text></g><g transform="translate(640 500)"><rect width="250" height="145" rx="28" class="card"/><text x="50" y="62" class="h">대중 인지도</text><text x="42" y="99" class="small">MC·예능·이슈 친화</text></g><g transform="translate(310 500)"><rect width="250" height="145" rx="28" class="card"/><text x="54" y="62" class="h">팀 시너지</text><text x="42" y="99" class="small">IVE 콘셉트 선명화</text></g><text x="430" y="390" class="title" fill="#ec489